# Hatsune Miku — a SEPARATE character (3D MMD model, rendered via three.js).
# Selecting this preset swaps the canvas to the MMD viewer (the model URL is a
# .pmx). Persona is Miku's own; other settings (LLM/ASR/TTS) inherit from
# conf.yaml. To give Miku her own voice, add a tts_config override here with a
# Miku reference clip (see Stage 4).
character_config:
  conf_name: "初音ミク"
  conf_uid: "miku_yyb_001"
  live2d_model_name: "yyb_miku_10th"
  character_name: "Miku"
  # English, stated rather than inherited: the voice, ASR and speech rules all
  # come from conf.yaml's "en", and the Japanese-written miku.txt under them made
  # the model answer in Japanese to be read by an English voice. miku_en.txt is
  # the same character in English; miku.txt stays for a Japanese setup.
  language: "en"
  persona_prompt_file: "prompts/personas/miku_en.txt"
