# KEHAI render host: an X server on GPU0 (nvidia-smi index 0, PCI 0x1A = 26) with NO display
# device, so the render Chrome presents on the GPU instead of reading every 4K frame back
# into Xvfb (SwapBuffers 29 ms/frame there = the 30 fps ceiling, 2026-11-05).
# Installed as /etc/X11/kehai-render-x.conf (Xorg.wrap only takes -config relative to /etc/X11):
#   sudo cp scripts/pcb-render-x/kehai-render-x.conf /etc/X11/kehai-render-x.conf
# Started by: Xorg :58 -config kehai-render-x.conf -sharevts -novtswitch -nolisten tcp -noreset vt8
# The physical monitor is on this GPU too, driven by GDM's :0 — this server must never take
# input devices or the display engine from it (AutoAddDevices off, UseDisplayDevice none).
Section "ServerLayout"
    Identifier "kehai-render"
    Screen 0 "S" 0 0
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
    Option "AllowEmptyInput" "true"
EndSection

Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "DontVTSwitch" "true"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection

Section "Files"
    ModulePath "/usr/lib/x86_64-linux-gnu/nvidia/xorg"
    ModulePath "/usr/lib/xorg/modules"
EndSection

Section "Device"
    Identifier "D"
    Driver "nvidia"
    BusID "PCI:26:0:0"
    Option "ProbeAllGpus" "false"
    Option "AllowEmptyInitialConfiguration" "true"
    Option "UseDisplayDevice" "none"
EndSection

Section "Screen"
    Identifier "S"
    Device "D"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Virtual 2160 3840
    EndSubSection
EndSection
